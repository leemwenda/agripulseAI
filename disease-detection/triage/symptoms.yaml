# Shared vocabulary of observable signs. Every disease file may only use ids listed here.
# `ask` is the plain-language question shown to the farmer / vet officer.
# Add new signs here as each new disease needs them.
signs:
  fever:
    ask: "Is the temperature high (about 39.5 C or above)?"
  enlarged_lymph_nodes:
    ask: "Are the lymph nodes swollen (in front of the shoulder or below the ear)?"
  ticks_present:
    ask: "Are ticks present on the animal (especially on the ears), or has it been in a tick-infested area?"
  laboured_breathing:
    ask: "Is the animal breathing fast or with difficulty?"
  frothy_nasal_discharge:
    ask: "Is there frothy or foamy discharge from the nose?"
  loss_of_appetite:
    ask: "Has the animal stopped eating or is it eating much less?"
  rapid_weight_loss:
    ask: "Is the animal losing condition quickly?"
  watery_eyes:
    ask: "Are the eyes watering or discharging?"
  diarrhoea:
    ask: "Does the animal have diarrhoea?"
  mouth_blisters:
    ask: "Are there blisters, ulcers or raw patches on the tongue, gums or lips?"
  excessive_salivation:
    ask: "Is the animal drooling or producing a lot of stringy saliva (often with smacking lips)?"
  hoof_lesions:
    ask: "Are there blisters or raw sores between the claws or on the coronary band (top of the hoof)?"
  lameness:
    ask: "Is the animal lame or reluctant to walk?"
  teat_lesions:
    ask: "Are there blisters or sores on the teats or udder?"
  reduced_milk_yield:
    ask: "Has milk production dropped suddenly?"
  multiple_animals_affected:
    ask: "Are several animals in the herd showing the same signs, or did the signs spread quickly?"
  skin_nodules:
    ask: "Are there firm, raised lumps (about 2-5 cm) in the skin?"
    from_photo_class: lumpy_skin_disease   # the photo model's class that ticks this sign
  swollen_limbs_or_brisket:
    ask: "Are the legs, brisket or dewlap swollen?"
  nasal_discharge:
    ask: "Is there discharge from the nose?"
  coughing:
    ask: "Is the animal coughing?"
  grunting_or_painful_breathing:
    ask: "Does the animal grunt or stand with elbows out / neck stretched, as if breathing hurts?"
  sudden_death:
    ask: "Did the animal die suddenly, with little or no illness seen beforehand?"
  bleeding_from_orifices:
    ask: "Is there unclotted blood coming from the nose, mouth, anus or other body openings?"
  staggering_or_trembling:
    ask: "Is the animal staggering, trembling, or collapsing?"
  abortion:
    ask: "Has the cow aborted or given birth early?"
  retained_placenta:
    ask: "Did the placenta fail to come away after calving?"
  swollen_joints:
    ask: "Are one or more joints swollen (e.g. knee, hock)?"
  repeat_breeding_failure:
    ask: "Has the cow repeatedly failed to conceive or held on to the bull/AI without success?"
  chronic_cough:
    ask: "Has the animal had a persistent cough for weeks or months?"
  chronic_weight_loss:
    ask: "Has the animal been losing weight slowly over weeks or months, even while eating normally?"
  pale_or_yellow_gums:
    ask: "Are the gums or eye membranes pale or yellowish, instead of pink?"
  aggressive_or_nervous_behaviour:
    ask: "Is the animal unusually aggressive, nervous or hard to handle?"
  dark_urine:
    ask: "Is the urine dark red or brown (like coffee or wine)?"
  udder_swelling_or_heat:
    ask: "Is the udder swollen, hot, hard or painful to touch?"
  abnormal_milk:
    ask: "Does the milk look abnormal (watery, clotted, or with blood/pus)?"
  swollen_gassy_muscle:
    ask: "Is there a swollen area of muscle that crackles or feels gassy when pressed?"
  tsetse_flies_present:
    ask: "Are tsetse flies present, or has the animal grazed in a tsetse-infested area?"
  nervous_signs_or_convulsions:
    ask: "Is the animal circling, high-stepping, twitching or convulsing?"
  abortion_storm:
    ask: "Have several pregnant animals in the herd aborted around the same time?"
  bloody_diarrhoea:
    ask: "Is there blood in the diarrhoea?"
  bottle_jaw_swelling:
    ask: "Is there soft swelling under the jaw (bottle jaw)?"
  dehydration_sunken_eyes:
    ask: "Do the eyes look sunken, or does the skin stay tented when pinched (signs of dehydration)?"
  weak_or_deformed_calves:
    ask: "Have any calves been born weak, small or deformed?"
  head_pressing_or_teeth_grinding:
    ask: "Is the animal grinding its teeth, pressing its head against something, or making odd chewing movements?"
  testicular_swelling:
    ask: "Is a bull's scrotum or testicles swollen or inflamed?"
  rough_dull_coat:
    ask: "Has the coat become rough, dull or unkept-looking?"
  reluctant_to_rise:
    ask: "Is the animal reluctant or unable to get up?"
  isolating_from_herd:
    ask: "Is the animal separating itself from the herd or moving noticeably less than usual?"
  rapid_heart_rate:
    ask: "Does the heart feel like it is beating unusually fast (felt on the chest, or a racing pulse)?"
