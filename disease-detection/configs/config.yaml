model_version: "cattle-health-v3"

# Image / training settings
image_size: 224
batch_size: 16
epochs: 30
patience: 5           # early stopping patience (train_v5.py watches validation LOSS, not accuracy)
learning_rate: 0.0001
uncertain_margin: 0.15  # if top-2 class probabilities are within this margin, the app says "uncertain"

# Data locations
data:
  # Cow-cropped copies made by crop_cows.py (see the steps at the bottom of this file).
  # To go back to the uncropped download, use raw_dir: data/raw/cattle_health_v1 and cropped: false.
  raw_dir: data/cropped/cattle_health_v1   # each class is one subfolder under here
  cropped: true                            # tells train_v5.py to mark the checkpoint "trained on cow crops"
  farm_dir: data/cropped/farm              # OPTIONAL: your own photos, <farm_dir>/<class name>/<one folder per animal>/*.jpg
  farm_split: [0.5, 0.25, 0.25]            # train / val / test for the farm photos
  near_dup_dist: 6                         # images this similar (of 64 hash bits) always stay in the same split
  processed_dir: data/processed
  split: [0.7, 0.15, 0.15]                 # train / val / test for the download
  seed: 42

# ---- THE ONLY PART YOU EDIT TO ADD A NEW DISEASE ----
# `name`  -> the label the model will output
# `dir`   -> the subfolder name under raw_dir holding that class's images
#
# foot_and_mouth_disease is DISABLED - the Kaggle source dataset didn't
# generalize to real farm photos (confirmed 97%-confidence false positive
# on a genuinely healthy cow, see captures/). Do not re-enable without new,
# more representative training data.
classes:
  - name: healthy
    dir: healthycows
  - name: lumpy_skin_disease
    dir: lumpycows
  # - name: foot_and_mouth_disease
  #   dir: fmd_cows
  # - name: mange
  #   dir: mange_cows

# Steps (from disease-detection/):
#   python3 crop_cows.py --src data/raw/cattle_health_v1 --dst data/cropped/cattle_health_v1
#   python3 crop_cows.py --src data/farm --dst data/cropped/farm          # only if you have farm photos
#   python3 src/preprocessing/prepare_dataset.py
#   python3 check_leakage.py                                             # expect 0 near-duplicates
#   python3 train_v5.py
#   python3 eval_folder.py --checkpoint models/cattle_health_v5.pt --data_dir data/realworld_eval
